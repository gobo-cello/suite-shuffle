version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    ignore:
      # Node.js は .node-version の 24 系に固定しているため @types/node も 24 系に留める
      - dependency-name: "@types/node"
        versions:
          - ">=25.0.0"
    groups:
      dependencies-major:
        patterns:
          - "*"
        update-types:
          - "major"
      dependencies-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/infra"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    ignore:
      # Node.js は .node-version の 24 系に固定しているため @types/node も 24 系に留める
      - dependency-name: "@types/node"
        versions:
          - ">=25.0.0"
    groups:
      dependencies-major:
        patterns:
          - "*"
        update-types:
          - "major"
      dependencies-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tokyo"
    ignore:
      # Node.js は .node-version の 24 系に固定しているため @types/node も 24 系に留める
      - dependency-name: "@types/node"
        versions:
          - ">=25.0.0"
    groups:
      dependencies-major:
        patterns:
          - "*"
        update-types:
          - "major"
      dependencies-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
