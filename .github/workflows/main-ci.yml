name: Main CI
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  warm-npm-cache:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        working-directory: [".", "infra", "app"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: ${{ matrix.working-directory }}
          cache-write: 'true'
