name: Deploy
on:
  push:
    branches:
      - main
    paths:
      - app/**
      - infra/**
      - .github/workflows/deploy.yml
      - .github/actions/setup-node-npm/**

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-slim
    environment: sandbox
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: infra
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: app
      - name: Build app
        working-directory: app
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_SUITE_SHUFFLE_SANDBOX_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Deploy SandboxGithubDeployRoleStack
        working-directory: infra
        run: npx cdk deploy SandboxGithubDeployRoleStack --require-approval never
        env:
          AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID }}
          AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID }}
          SUITE_SHUFFLE_DOMAIN_NAME: ${{ vars.SUITE_SHUFFLE_DOMAIN_NAME }}
      - name: Deploy SandboxDnsStack
        working-directory: infra
        run: npx cdk deploy SandboxDnsStack --require-approval never
        env:
          AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID }}
          AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID }}
          SUITE_SHUFFLE_DOMAIN_NAME: ${{ vars.SUITE_SHUFFLE_DOMAIN_NAME }}
      - name: Deploy SandboxHostingStack
        working-directory: infra
        run: npx cdk deploy SandboxHostingStack --require-approval never
        env:
          AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID }}
          AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID }}
          SUITE_SHUFFLE_DOMAIN_NAME: ${{ vars.SUITE_SHUFFLE_DOMAIN_NAME }}
      - name: Add sandbox URL to job summary
        run: |
          echo "🔗 Sandbox: https://sandbox.${{ vars.SUITE_SHUFFLE_DOMAIN_NAME }}" >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: sandbox
    runs-on: ubuntu-slim
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: infra
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: app
      - name: Build app
        working-directory: app
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_SUITE_SHUFFLE_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Deploy ProductionGithubDeployRoleStack
        working-directory: infra
        run: npx cdk deploy ProductionGithubDeployRoleStack --require-approval never
        env:
          AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID }}
          AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID }}
          SUITE_SHUFFLE_DOMAIN_NAME: ${{ vars.SUITE_SHUFFLE_DOMAIN_NAME }}
      # ProductionGithubDeployRoleStackがus-east-1へのAssumeRole許可を追加した直後は、
      # 同じcdk deployコマンドでus-east-1のstackを一括指定すると、CDKがCloudFormation
      # 更新完了前にus-east-1のasset publishing roleを解決しようとして失敗するため、
      # 別stepとしてIAM Policy更新の反映後に実行する。
      - name: Deploy ProductionDnsStack
        working-directory: infra
        run: npx cdk deploy ProductionDnsStack --require-approval never
        env:
          AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID }}
          AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID }}
          SUITE_SHUFFLE_DOMAIN_NAME: ${{ vars.SUITE_SHUFFLE_DOMAIN_NAME }}
          SANDBOX_SUBDOMAIN_NAME_SERVERS: ${{ vars.SANDBOX_SUBDOMAIN_NAME_SERVERS }}
      - name: Deploy ProductionHostingStack
        working-directory: infra
        # ProductionHostingStackはProductionDnsStackのhostedZone/certificateを
        # cross-stack参照するため、このcdk deployは依存先のProductionDnsStackも
        # 再合成・再デプロイする。SANDBOX_SUBDOMAIN_NAME_SERVERSを渡さないと、
        # ProductionDnsStackのNS委譲レコードが未指定と判定され削除されてしまう。
        run: npx cdk deploy ProductionHostingStack --require-approval never
        env:
          AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID }}
          AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID }}
          SUITE_SHUFFLE_DOMAIN_NAME: ${{ vars.SUITE_SHUFFLE_DOMAIN_NAME }}
          SANDBOX_SUBDOMAIN_NAME_SERVERS: ${{ vars.SANDBOX_SUBDOMAIN_NAME_SERVERS }}
