name: PR CI Gate
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  biome:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-npm
      - run: npx biome ci --reporter=github .

  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-npm
      - run: npm test

  actionlint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/actionlint.sh -color
        env:
          GH_TOKEN: ${{ github.token }}

  infra-build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: infra
      - working-directory: infra
        run: npm run build

  infra-test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: infra
      - working-directory: infra
        run: npm test

  cdk-synth:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: infra
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: app
      - name: Build app
        working-directory: app
        run: npm run build
      - working-directory: infra
        run: npx cdk synth
        env:
          AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID: '111111111111'
          AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID: '222222222222'
          SUITE_SHUFFLE_DOMAIN_NAME: suite-shuffle.example.com

  cdk-diff:
    runs-on: ubuntu-slim
    environment: sandbox
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: infra
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: app
      - name: Build app
        working-directory: app
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_SUITE_SHUFFLE_SANDBOX_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - working-directory: infra
        run: npx cdk diff SandboxGithubDeployRoleStack SandboxDnsStack SandboxHostingStack
        env:
          AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_SANDBOX_ACCOUNT_ID }}
          AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID: ${{ vars.AWS_SUITE_SHUFFLE_PRODUCTION_ACCOUNT_ID }}
          SUITE_SHUFFLE_DOMAIN_NAME: ${{ vars.SUITE_SHUFFLE_DOMAIN_NAME }}

  app-build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: app
      - working-directory: app
        run: npm run build

  app-test-unit:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: app
      - working-directory: app
        run: npm run test:unit

  app-test-dom:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-npm
        with:
          working-directory: app
      - working-directory: app
        run: npm run test:dom

  knip:
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "app", "infra"]
        mode: ["default", "production"]
    runs-on: ubuntu-slim
    env:
      KNIP_DISABLE_RAW_TRANSFER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-npm
      - if: ${{ matrix.workspace != '.' }}
        uses: ./.github/actions/setup-node-npm
        with:
          working-directory: ${{ matrix.workspace }}
      - name: knip (${{ matrix.workspace }}, ${{ matrix.mode }})
        run: >-
          npx knip --workspace ${{ matrix.workspace }}
          ${{ matrix.mode == 'production' && '--production --strict' || '' }}
          --reporter github-actions

  pr-ci-gate:
    needs:
      - biome
      - test
      - actionlint
      - infra-build
      - infra-test
      - cdk-synth
      - cdk-diff
      - app-build
      - app-test-unit
      - app-test-dom
      - knip
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-slim
    steps:
      - name: Verify CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '
            all(
              .[];
              .result == "success" or .result == "skipped"
            )
          '
